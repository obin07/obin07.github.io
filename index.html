<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--     <meta http-equiv="refresh" content="30"> -->
    <meta name="author" content="Y@m">
    <title>o3in07</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preload" href="./images/umbagog.jpg" as="image">
    <link rel="preload" href="./images/boomerang.jpg" as="image">
    <link rel="preload" href="./images/goose.jpg" as="image">
</head>

<body>
    <header>
        <nav>
            <h1>Sony 6400</h1>
            <div class="nav-actions">
                <button id="dark-toggle" class="dark-toggle" aria-pressed="false" title="Toggle dark mode">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor" />
                    </svg>
                </button>
            </div>
        </nav>
    </header>
    <div class="gallery" aria-live="polite">
        <div class="thumbs">
            <ul id="thumb-list" role="list" aria-label="Image thumbnails"></ul>
            <div class="load-more-wrap">
                <button id="load-more" class="load-more" aria-controls="thumb-list">Load more</button>
            </div>
        </div>
        <div class="display" aria-live="polite" aria-atomic="true">
            <img id="main-display" src="" alt="" role="img">
        </div>
    </div>
    <!-- Accessible viewer modal for mobile -->
    <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-hidden="true">
        <button id="viewer-close" class="viewer-close" aria-label="Close viewer">✕</button>
        <button id="viewer-prev" class="viewer-nav viewer-prev" aria-label="Previous image">‹</button>
        <div class="viewer-stage" role="document">
            <img id="viewer-img" src="" alt="" />
            <div id="viewer-caption" class="viewer-caption" aria-live="polite"></div>
        </div>
        <button id="viewer-next" class="viewer-nav viewer-next" aria-label="Next image">›</button>
    </div>

    <footer>
        <p>&#169; <em>obin07 Photography</em></p>
    </footer>
    <script src="./app.js"></script>
</body>

</html>
